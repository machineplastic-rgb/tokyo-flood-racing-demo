const cielo = crearCielo(THREE, { cielo: ['#1f9bf0', '#3fb2f6', '#7fd0fa'], niebla: '#b4e0f8', sol: ['#fff0cf', 3.5], tinte: '#ffffff' }, SOLDIR.clone().multiplyScalar(150)); scene.add(cielo.mesh);

const txl = new THREE.TextureLoader(), texCache = {};
function texAlpha(nombre) {

const progreso = (t) => document.getElementById('carga').textContent = t;
const cargar = (url) => new Promise((ok, mal) => new GLTFLoader().load(url, ok, undefined, mal));

  fetch('instancias.json').then(r => r.json()), fetch('pista.json').then(r => r.json())]).catch(e => { progreso('Error al cargar: abre con el servidor local (' + e.message + ')'); throw e; });
progreso('Montando la ciudad…');

// ciudad estatica: fusion por trozos de 60 m (opaco = 1 llamada por trozo; alpha = 1 por textura y trozo)
{
  ciudad.scene.updateMatrixWorld(true); const cubos = {};
  ciudad.scene.traverse(o => {
    if (!o.isMesh) return; const al = esAlpha(o.material); const g = prepara(o, o.matrixWorld, al, true); if (!g) return;
    g.computeBoundingBox(); const c = g.boundingBox.getCenter(new THREE.Vector3());
    const k = `${Math.floor(c.x / 120)}_${Math.floor(c.z / 120)}_${al ? o.material.name.replace(/\.\d+$/, '') : 'op'}`;
    (cubos[k] ||= { al, mat: al ? materialAlpha(o.material.name) : matOpaco, gs: [] }).gs.push(g);
  });
  window.__CULL = [];
  for (const b of Object.values(cubos)) { const gg = mergeGeometries(b.gs); gg.computeBoundingSphere(); const me = new THREE.Mesh(gg, b.mat); me.userData.ciudad = !b.al; me.userData.bs = gg.boundingSphere; scene.add(me); window.__CULL.push(me); }
}
// biblioteca: cada codigo = 1 InstancedMesh opaco + 1 por textura alpha (todas sus copias en una llamada)
{
  bibl.scene.updateMatrixWorld(true); const raiz = {};
  bibl.scene.traverse(o => { if (/^[A-Z]{3}-\d\d$/.test(o.name)) raiz[o.name] = o; });
  const T = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), p = new THREE.Vector3(), s = new THREE.Vector3();
  for (const [code, lista] of Object.entries(inst)) {
    const r = raiz[code]; if (!r) continue;
    const inv = r.matrixWorld.clone().invert(), grupos = {};
    r.traverse(o => {
      if (!o.isMesh) return; const al = esAlpha(o.material);
      const g = prepara(o, inv.clone().multiply(o.matrixWorld), al); if (!g) return;
      (grupos[al ? o.material.name.replace(/\.\d+$/, '') : 'op'] ||= { al, mat: al ? materialAlpha(o.material.name) : matOpaco, gs: [] }).gs.push(g);
    });
    for (const gr of Object.values(grupos)) {
      const im = new THREE.InstancedMesh(mergeGeometries(gr.gs), gr.mat, lista.length);
      lista.forEach((v, i) => { p.set(v[0], v[1], v[2]); e.set(0, v[3], 0); q.setFromEuler(e); s.set(v[4], v[5], v[6]); T.compose(p, q, s); im.setMatrixAt(i, T); });
      im.computeBoundingSphere(); scene.add(im);
    }
  }
}

if (!new URLSearchParams(location.search).has('notorre')) { const T = torre109(THREE, TCN, 12, 62); T.updateMatrixWorld(true); const bucket = new Map(), keep = [];
  T.traverse(o => { if (!o.isMesh) return; if (o.onBeforeRender && o.onBeforeRender.toString().length > 40) { keep.push(o); return; } const m = o.material; if (!bucket.has(m)) bucket.set(m, []); let g = o.geometry.clone(); g.applyMatrix4(o.matrixWorld); if (g.index) g = g.toNonIndexed(); for (const k of Object.keys(g.attributes)) if (!['position', 'normal', 'uv'].includes(k)) g.deleteAttribute(k); if (!g.attributes.uv) g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(g.attributes.position.count * 2), 2)); if (!g.attributes.normal) g.computeVertexNormals(); bucket.get(m).push(g); });
  for (const [m, gs] of bucket) { const me = new THREE.Mesh(mergeGeometries(gs), m); me.userData.ciudad = !!(m.alphaTest ? false : true); scene.add(me); }
  for (const o of keep) { o.updateWorldMatrix(true, false); o.matrixAutoUpdate = false; o.matrix.copy(o.matrixWorld); scene.add(o); } }
// ---------------- mapa horneado: sombras del sol y distancia a muros (una vez al cargar)
progreso('Horneando sombras…');
{ const t0 = performance.now(); const mp = hornear(THREE, renderer, scene, { x0: -420, z0: -230, sx: 520, sz: 250 }, SOLDIR); AGUA.u.uSh.value = mp.tex; AGUA.u.uBox.value.copy(mp.box); window.__BAKE_MS = Math.round(performance.now() - t0); window.__MAPA = mp;
  if (new URLSearchParams(location.search).has('dbg')) { const W = mp.rt.width, H = mp.rt.height, px = new Uint8Array(W * H * 4); renderer.readRenderTargetPixels(mp.rt, 0, 0, W, H, px); const c = document.createElement('canvas'); c.width = W; c.height = H; c.style.cssText = 'position:fixed;left:0;bottom:0;width:480px;height:' + Math.round(480 * H / W) + 'px;z-index:9;border:2px solid #f0f;image-rendering:pixelated'; const g = c.getContext('2d'), im = g.createImageData(W, H); for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { const a = ((H - 1 - y) * W + x) * 4, b = (y * W + x) * 4; im.data[b] = px[a] * 255 / 255; im.data[b + 1] = px[a + 1]; im.data[b + 2] = Math.min(255, px[a + 2] * 4); im.data[b + 3] = 255; } g.putImageData(im, 0, 0); document.body.appendChild(c); } }
// ---------------- pista (centro, ancho, normales) para colisiones y vueltas
const P = pista.puntos.map(([x, z, w]) => ({ x, z, w })), N = P.length;
P.forEach((a, i) => { const b = P[(i + 1) % N], c = P[(i - 1 + N) % N]; let tx = b.x - c.x, tz = b.z - c.z; const l = Math.hypot(tx, tz) || 1; a.tx = tx / l; a.tz = tz / l; a.nx = -a.tz; a.nz = a.tx; });
const OB = pista.obstaculos.map(([x, z, r]) => ({ x, z, r }));
vestir(THREE, scene, P);
progreso('Colocando sprites…'); { const t0 = performance.now(); const sp = await crearSprites(THREE, scene, P, window.__MAPA, { excluir: { x: TCN.x, z: TCN.z, r: 55 }, desde: 30, hasta: 430, audit: +(new URLSearchParams(location.search).get('audit') || 0) }); if (new URLSearchParams(location.search).has('nospr')) sp.mesh.visible = false; window.__SPR = sp.cartas + ' cartas · ' + Math.round(sp.tris) + ' tri · ' + Math.round(performance.now() - t0) + ' ms'; }
// ---------------- elementos de juego sobre el trazado: plataformas de TURBO y RAMPAS de salto (en los tramos mas rectos)
function recta(f) {
  let mejor = Math.floor(f * N) % N, mc = 1e9;
  for (let k = -40; k <= 40; k++) { const i = (Math.floor(f * N) + k + N) % N, a = P[(i - 6 + N) % N], b = P[(i + 6) % N]; const c = Math.abs(a.tx * b.tz - a.tz * b.tx) + Math.abs(k) * .0005; if (c < mc && P[i].w >= 12) { mc = c; mejor = i; } }

}
const elem = (i, len, wid) => { const p = P[i]; return { i, x: p.x, z: p.z, tx: p.tx, tz: p.tz, nx: p.nx, nz: p.nz, len, wid: Math.min(wid, p.w * .42) }; };
// Paso 2 (25-nov): turbos a la SALIDA de las curvas (premian trazarlas bien) + tras la chicane y en Dogenzaka; rampas en rectas; chicane de escombros en Bunkamura-dori
const RAMPAS_E = [recta(.17), recta(.66), recta(.88)].map(i => elem(i, 9, 12));
const PADS_E = [757, 802, 843, 1697, 440, 1290].map(i => elem(i, 7, 12)).filter(p => RAMPAS_E.every(r => Math.min((p.i - r.i + N) % N, (r.i - p.i + N) % N) > 22));
const CHICANE = [[385, -1], [402, 1]].map(([i, s]) => { const p = P[i]; return { x: p.x + p.nx * s * p.w * .27, z: p.z + p.nz * s * p.w * .27, r: 2.6 }; });
for (const c of CHICANE) { OB.push(c); const m = new THREE.Mesh(new THREE.CylinderGeometry(c.r * .8, c.r, 3.2, 8), new THREE.MeshLambertMaterial({ color: '#d9772b', flatShading: true })); m.position.set(c.x, 1.2, c.z); scene.add(m); }   // escombros visibles (provisionales)
const dentro = (e, x, z) => { const dx = x - e.x, dz = z - e.z, u = dx * e.tx + dz * e.tz, v = dx * e.nx + dz * e.nz; return Math.abs(v) < e.wid / 2 && Math.abs(u) < e.len / 2 ? u : null; };
{
  const cv = document.createElement('canvas'); cv.width = 128; cv.height = 256; const g = cv.getContext('2d');
  g.fillStyle = '#ffcf33'; g.fillRect(0, 0, 128, 256); g.fillStyle = '#1b1f24';
  for (let y = 10; y < 256; y += 64) { g.beginPath(); g.moveTo(10, y); g.lineTo(64, y + 38); g.lineTo(118, y); g.lineTo(118, y + 20); g.lineTo(64, y + 58); g.lineTo(10, y + 20); g.fill(); }

  const mp = new THREE.MeshBasicMaterial({ map: t, polygonOffset: true, polygonOffsetFactor: -2 });
  for (const e of PADS_E) { const gr = new THREE.Group(), m = new THREE.Mesh(new THREE.PlaneGeometry(e.wid, e.len), mp); m.rotation.x = -Math.PI / 2; gr.add(m); gr.position.set(e.x, .06, e.z); gr.rotation.y = Math.atan2(e.tx, e.tz); scene.add(gr); }

    const borde = new THREE.Mesh(new THREE.BoxGeometry(e.wid, .12, .35), mb); borde.position.set(0, h + .02, L - .1); gr.add(borde);

// ---------------- salpicaduras (particulas baratas)
const NP = 260, ppos = new Float32Array(NP * 3).fill(-999), pvel = new Float32Array(NP * 3), pvida = new Float32Array(NP); let pk = 0;

function salpica(x, z, n) { for (let k = 0; k < n; k++) { const a = Math.random() * 6.28, r = 2 + Math.random() * 5; chorro(x, .2, z, Math.cos(a) * r, 3 + Math.random() * 5, Math.sin(a) * r); } }

function cercano(x, z, desde) {

  return mejor;
}

// ---------------- moto bloque (solo escala)
const moto = new THREE.Group();

const cuerpo = new THREE.Group(); cuerpo.add(casco, piloto, morro); moto.add(cuerpo); scene.add(moto);
const I0 = +(new URLSearchParams(location.search).get('i') || 130);
const estado = { y: 0, vy: 0, yr: 0, turbo: 0, carga: 0, sacudida: 0, x: P[I0].x, z: P[I0].z, yaw: Math.atan2(P[I0].tx, P[I0].tz), vx: 0, vz: 0, idx: I0, cp: 0, vuelta: 1, t0: null, tv: 0, mejor: null, derrape: false };

const VUELTAS = ((pista.modos.rojo || pista.modos.circuito || {}).vueltas) || 3, CPS = 6;

// ---------------- controles (teclado + tactil)
const ent = { gas: 0, freno: 0, izq: 0, der: 0 }; let autoGas = MOVIL, camAerea = new URLSearchParams(location.search).has('aer'), empezado = false;   // el auto-gas espera al primer toque
const teclas = { ArrowUp: 'gas', KeyW: 'gas', ArrowDown: 'freno', KeyS: 'freno', Space: 'freno', ArrowLeft: 'izq', KeyA: 'izq', ArrowRight: 'der', KeyD: 'der' };
addEventListener('keydown', e => { if (teclas[e.code]) { ent[teclas[e.code]] = 1; e.preventDefault(); } if (e.code === 'KeyR') reset(); if (e.code === 'KeyC') toggleCam(); });
addEventListener('keyup', e => { if (teclas[e.code]) ent[teclas[e.code]] = 0; });
for (const id of ['izq', 'der', 'gas', 'freno']) {
  const b = document.getElementById(id);
  b.addEventListener('pointerdown', e => { empezado = true; ent[id] = 1; b.classList.add('on'); b.setPointerCapture(e.pointerId); e.preventDefault(); });
  for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) b.addEventListener(ev, () => { ent[id] = 0; b.classList.remove('on'); });
}
const bAuto = document.getElementById('bAuto'); bAuto.classList.toggle('on', autoGas); bAuto.style.background = autoGas ? '#1c7c8ccc' : '';

function toggleCam() { camAerea = !camAerea; }
document.getElementById('bCam').onclick = toggleCam;
function reset() { Object.assign(estado, { y: 0, vy: 0, yr: 0, turbo: 0, carga: 0, x: ultimoCP.x, z: ultimoCP.z, yaw: ultimoCP.yaw, vx: 0, vz: 0, idx: ultimoCP.idx }); }
document.getElementById('bReset').onclick = reset;

// ---------------- fisica arcade
function fisica(dt) {
  const fx = Math.sin(estado.yaw), fz = Math.cos(estado.yaw);

  const ag = Math.exp(-(estado.derrape ? M.agarreDerrape : M.agarre) * dt);
  const roz = Math.exp(-(gas ? .08 : .35) * dt);

  estado.yaw -= giro * M.giro * dt * efi * (estado.derrape ? M.giroDerrape : 1) * (aire ? .35 : 1);
  estado.x += estado.vx * dt; estado.z += estado.vz * dt;

  const d = (estado.x - s.x) * s.nx + (estado.z - s.z) * s.nz, lim = s.w / 2 - M.radio;
  if (Math.abs(d) > lim) {

    const vn = estado.vx * s.nx + estado.vz * s.nz; if (vn * sg > 0) { estado.vx -= s.nx * vn * 1.3; estado.vz -= s.nz * vn * 1.3; }

  if (estado.derrape && !aire) { estado.carga = Math.min(2, estado.carga + dt); if (Math.random() < .6) chorro(estado.x - fx * 1.2, .2, estado.z - fz * 1.2, (Math.random() - .5) * 4, 2 + Math.random() * 2, (Math.random() - .5) * 4); }
  else if (estado.carga > 0) { if (estado.carga > .7) { estado.turbo = Math.max(estado.turbo, .5 + estado.carga * .6); estado.sacudida = .4; } estado.carga = 0; }

  estado.yr = 0;

    if (u > e.len / 2 - 2.2 && nfs > 7 && estado.vy <= 0) { estado.vy = 4 + nfs * .16; estado.y = estado.yr; estado.sacudida = .3; salpica(estado.x, estado.z, 14); } }
  if (estado.y > 0 || estado.vy > 0) { estado.vy -= 20 * dt; estado.y += estado.vy * dt; if (estado.y <= 0) { if (estado.vy < -4) { salpica(estado.x, estado.z, 50); estado.sacudida = .35; } estado.y = 0; estado.vy = 0; } }
  return giro;
}

// ---------------- vueltas y checkpoints
function carrera(t) {
  if (estado.t0 === null && Math.hypot(estado.vx, estado.vz) > 1) estado.t0 = t;
  const sig = (estado.cp + 1) % CPS, idxCp = Math.floor(sig * N / CPS);
  const dif = (estado.idx - idxCp + N) % N;
  if (dif < 25) {                                                          // paso por el siguiente checkpoint
    estado.cp = sig; ultimoCP = { x: estado.x, z: estado.z, yaw: estado.yaw, idx: estado.idx };
    if (sig === 0 && estado.t0 !== null) {
      const tv = t - estado.t0 - estado.tv; estado.tv += tv;
      if (!estado.mejor || tv < estado.mejor) { estado.mejor = tv; try { localStorage.setItem('tfr_mejor_vuelta', tv.toFixed(2)); } catch (e) {} }
      estado.vuelta++;

  }
}
const fmt = (s) => s == null ? '--' : `${Math.floor(s / 60)}:${(s % 60).toFixed(1).padStart(4, '0')}`;

// ---------------- bucle
document.getElementById('carga').remove();
const reloj = new THREE.Clock(); let tJuego = 0, fpsN = 0, fpsT = 0, fps = 60, camPos = new THREE.Vector3(estado.x, 3, estado.z);
const hudP = document.getElementById('perf'), hudC = document.getElementById('carrera'), hudV = document.getElementById('vel'), hudZ = document.getElementById('zona');
function frame() {
  const real = reloj.getDelta(), dt = Math.min(.05, real); tJuego += dt; const t = tJuego;   // cronometro = tiempo de juego
  const giro = fisica(dt); carrera(t);
  const v = Math.hypot(estado.vx, estado.vz);
  moto.position.set(estado.x, (estado.y > 0 ? estado.y : estado.yr) + Math.sin(t * 7) * .03, estado.z); moto.rotation.y = estado.yaw;
  cuerpo.rotation.z += ((giro * -.25 * Math.min(1, v / 15)) - cuerpo.rotation.z) * Math.min(1, dt * 6);       // inclinacion visual
  cuerpo.rotation.x += ((-Math.min(.12, (ent.gas || autoGas) && v < 8 ? .12 : 0)) - cuerpo.rotation.x) * Math.min(1, dt * 3);   // morro arriba al arrancar
  const fx = Math.sin(estado.yaw), fz = Math.cos(estado.yaw);
  if (v > 4 && estado.y <= 0.05) for (let k = 0; k < Math.min(3, v * dt * 1.6 + Math.random()); k++) { const l = (Math.random() < .5 ? -1 : 1) * .7; chorro(estado.x - fx * 1.4 + Math.cos(estado.yaw) * l, .15, estado.z - fz * 1.4 - Math.sin(estado.yaw) * l, -fx * v * .25 + (Math.random() - .5) * 3 + Math.cos(estado.yaw) * l * 3, 1.5 + Math.random() * 2.5, -fz * v * .25 + (Math.random() - .5) * 3 - Math.sin(estado.yaw) * l * 3); }
  for (let i = 0; i < NP; i++) { if (pvida[i] <= 0) { ppos[i * 3 + 1] = -999; continue; } pvida[i] -= dt; pvel[i * 3 + 1] -= 14 * dt; ppos[i * 3] += pvel[i * 3] * dt; ppos[i * 3 + 1] += pvel[i * 3 + 1] * dt; ppos[i * 3 + 2] += pvel[i * 3 + 2] * dt; if (ppos[i * 3 + 1] < 0) pvida[i] = 0; }
  puntos.geometry.attributes.position.needsUpdate = true;
  if (camAerea) { camera.position.set(estado.x, 120, estado.z + 1); camera.lookAt(estado.x, 0, estado.z); }
  else {
    const dist = 8 + v * .06; let cx = estado.x - fx * dist, cz = estado.z - fz * dist;
    const ci = cercano(cx, cz, estado.idx), s = P[ci], d = (cx - s.x) * s.nx + (cz - s.z) * s.nz, lim = s.w / 2 - .4;   // la camara no entra en los edificios
    if (Math.abs(d) > lim) { cx -= s.nx * (Math.abs(d) - lim) * Math.sign(d); cz -= s.nz * (Math.abs(d) - lim) * Math.sign(d); }
    camPos.lerp(new THREE.Vector3(cx, 1.9 + (estado.y + estado.yr) * .6, cz), 1 - Math.exp(-dt * 7)); camera.position.copy(camPos);
    if (estado.sacudida > 0) camera.position.add(new THREE.Vector3((Math.random() - .5) * .25, (Math.random() - .5) * .25, (Math.random() - .5) * .25).multiplyScalar(estado.sacudida * 2));
    camera.fov += ((54 + v * .3 + (estado.turbo > 0 ? 14 : 0)) - camera.fov) * Math.min(1, dt * 3); camera.updateProjectionMatrix();
    camera.lookAt(estado.x + fx * 12, 6.4, estado.z + fz * 12);
  }
  { const hq = new URLSearchParams(location.search).get('hero'); if (hq) { const [dx, h, dz, fov, ly] = hq.split(',').map(Number); camera.position.set(TCN.x + dx, h, TCN.z + dz); camera.fov = fov; camera.updateProjectionMatrix(); camera.lookAt(TCN.x, ly, TCN.z); } }
  AGUA.u.uT.value = performance.now() / 1000; AGUA.u.uMoto.value.set(estado.x, estado.z, Math.sin(estado.yaw), Math.cos(estado.yaw)); AGUA.u.uVel.value = Math.hypot(estado.vx, estado.vz); cielo.update(camera, performance.now() / 1000); if (scene.userData.pajaros) scene.userData.pajaros(performance.now() / 1000, camera);
  if (window.__CULL && ((window.__cf = (window.__cf || 0) + 1) % 8 === 0 || window.__cf < 4)) for (const m of window.__CULL) { const b = m.userData.bs; m.visible = Math.hypot(camera.position.x - b.center.x, camera.position.z - b.center.z) < 235 + b.radius * .55; }
  renderer.render(scene, camera);
  if (!window.__dumped && new URLSearchParams(location.search).has('draws') && (window.__f = (window.__f || 0) + 1) > 3) { window.__dumped = 1; const cat = {}; const add = (n, o) => { const c = cat[n] ||= { m: 0, t: 0 }; c.m++; const g = o.geometry; c.t += g.index ? g.index.count / 3 : g.attributes.position.count / 3; };
    scene.traverse(o => { if (!(o.isMesh || o.isPoints || o.isLine)) return; if (!o.visible) return; let v = true, q = o; while (q) { if (!q.visible) v = false; q = q.parent; } if (!v) return;
      const m = Array.isArray(o.material) ? o.material[0] : o.material, tipo = o.isInstancedMesh ? 'instancia' : o.userData.ciudad !== undefined ? 'ciudad' : m && m.isShaderMaterial ? 'shader' : m && m.alphaTest ? 'alpha' : 'otro'; add(tipo, o); });
    const pre = document.createElement('pre'); pre.id = 'draws'; pre.style.cssText = 'position:fixed;left:8px;top:120px;z-index:99;background:#000c;color:#0f0;font:14px monospace;padding:8px;white-space:pre-wrap;max-width:900px'; pre.textContent = Object.entries(cat).map(([k, v]) => k + ': ' + v.m + ' mallas, ' + Math.round(v.t / 1000) + 'k tri').join(' / ') + ' / calls=' + renderer.info.render.calls; document.body.appendChild(pre); }
  fpsN++; fpsT += real;

    if (fps < 40 && pr > .6) { pr = Math.max(.6, pr - .1); renderer.setPixelRatio(pr); } else if (fps > 57 && pr < PR_MAX) { pr = Math.min(PR_MAX, pr + .05); renderer.setPixelRatio(pr); }
    const inf = renderer.info.render;
    hudP.innerHTML = `${VERSION}<br>${fps.toFixed(0)} fps · ${inf.calls} llamadas<br>${(inf.triangles / 1000).toFixed(0)}k triángulos · res ${pr.toFixed(2)}<br>horneado ${window.__BAKE_MS} ms · sprites ${window.__SPR}`;
  }
  const tc = estado.t0 === null ? 0 : t - estado.t0;
  hudC.textContent = estado.vuelta > VUELTAS ? `¡Meta! ${fmt(estado.tv)} · mejor vuelta ${fmt(estado.mejor)}` : `Vuelta ${estado.vuelta}/${VUELTAS} · ${fmt(tc - estado.tv)} · mejor ${fmt(estado.mejor)}`;
  hudV.textContent = `${Math.round(v * 3.6)} km/h${estado.turbo > 0 ? ' · ¡TURBO!' : estado.derrape ? ' · DERRAPE ' + '▮'.repeat(Math.floor(estado.carga * 2.5)) : ''}`;
  hudZ.textContent = pista.zonas[estado.idx];
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
window.__G = { estado, P, scene, camera, PADS_E, RAMPAS_E, renderer, ent, fisica, carrera };   // para pruebas automaticas
</script>
